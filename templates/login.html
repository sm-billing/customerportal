<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body style="background: #fff; min-height: 100vh;">

<!-- Flash message (red/green alert at top right) -->
<div aria-live="polite" aria-atomic="true" class="position-fixed top-0 end-0 p-3" style="z-index:1080; min-width:320px;">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert" style="min-width:320px;">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
</div>

<!-- Centered login form -->
<div class="d-flex justify-content-center align-items-start" style="min-height: 100vh; padding-top: 80px;">
  <div class="card border-0 p-4" style="max-width: 420px; width: 100%; border-radius: 16px; font-size: 0.97rem; background: #fff; box-shadow: none; border: 1px solid #e0e0e0;">
    <div class="text-center mb-4 fs-2 navbar-brand fw-bold">
       STCN
    </div>
    <form method="post" action="/">
      <div class="mb-3">
        <input type="text" class="form-control" id="username" name="username" placeholder="Username" required autofocus style="height: 48px; border-radius: 8px;">
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required style="height: 48px; border-radius: 8px;">
      </div>
      <button type="submit" class="btn btn-success w-100 py-2 fw-bold" style="border-radius: 24px; font-size: 1.1rem; letter-spacing: 0.5px;">Log In</button>
    </form>
  </div>
</div>

</body>
</html>
