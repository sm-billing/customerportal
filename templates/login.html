<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="background: #fff; min-height: 100vh;">



<!-- Centered login form -->
<div class="d-flex justify-content-center align-items-start" style="min-height: 100vh; padding-top: 80px;">
  <div class="card border-0 p-4" style="max-width: 420px; width: 100%; border-radius: 16px; font-size: 0.97rem; background: #fff; box-shadow: none; border: 1px solid #e0e0e0;">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" style="max-width: 120px; max-height: 60px; width: auto; height: auto; object-fit: contain; margin-bottom: 18px;" onerror="this.style.display='none'">
    </div>
    <form method="post" action="/">
      <div class="mb-3">
        <input type="text" class="form-control" id="username" name="username" placeholder="Username" required autofocus style="height: 48px; border-radius: 8px;">
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="password" name="password" placeholder="Password" required style="height: 48px; border-radius: 8px;">
      </div>
      <button type="submit" class="btn btn-success w-100 py-2 fw-bold" style="border-radius: 24px; font-size: 1.1rem; letter-spacing: 0.5px;">Log In</button>
    </form>
  </div>
</div>

<!-- Error Toast notification container -->
<div aria-live="polite" aria-atomic="true" class="position-fixed top-0 end-0 p-3" style="z-index: 1080; min-width: 320px;">
  {% if error %}
    <div id="toast-alert" class="toast align-items-center text-bg-danger border-0 show" role="alert" data-bs-delay="3500" style="min-width: 300px;">
      <div class="d-flex">
        <div class="toast-body">
          {{ error }}
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  {% endif %}
</div>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    var toastEl = document.getElementById('toast-alert');
    if (toastEl) {
      var toast = new bootstrap.Toast(toastEl, { delay: 3500 });
      toast.show();
    }
  });
</script>

</body>
</html>
